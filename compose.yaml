services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "10000"
      REDIS_URL: redis://redis:6379/0
      DATABASE_PATH: /data/media_downloader.db
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - app-data:/data
      - downloads:/app/downloads

volumes:
  app-data:
  downloads:
