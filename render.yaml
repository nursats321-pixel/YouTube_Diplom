services:
  - type: web
    name: youtube-url
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-url-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: youtube-url-tasks
          property: connectionString

  - type: keyvalue
    name: youtube-url-tasks
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: youtube-url-db
    plan: free
    region: oregon
    databaseName: youtube_url
